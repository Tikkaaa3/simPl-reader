name: Release

# Push a version tag (for example v0.1.0) to build the Windows x64 installer and
# portable folder and publish them as a draft GitHub Release. macOS (.dmg) and
# Linux (AppImage) jobs are added once the reader supports those targets.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (x.y.z), used when there is no tag
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Derive the version and tag
        id: version
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            $version = '${{ github.ref_name }}'.TrimStart('v')
            $tag = '${{ github.ref_name }}'
          } else {
            $version = '${{ github.event.inputs.version }}'
            $tag = "v$version"
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid version: $version" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache Cargo and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install the pinned Inno Setup 6.7.3
        shell: pwsh
        run: |
          $dir = Join-Path $env:GITHUB_WORKSPACE 'target\tools\inno-6.7.3'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          # Same compiler and checksum as installer/README.md.
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $setup
          $hash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash
          if ($hash -ne '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732') { throw "Unexpected Inno Setup checksum: $hash" }
          $process = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/CURRENTUSER','/PORTABLE=1',"/DIR=`"$dir`""
          if ($process.ExitCode -ne 0 -or -not (Test-Path -LiteralPath (Join-Path $dir 'ISCC.exe'))) { throw 'Inno Setup installation failed.' }

      - name: Fetch all locked dependencies
        # License collection runs cargo metadata offline, which needs every platform's crates.
        run: cargo fetch --locked

      - name: Check formatting, lints and workspace tests
        shell: pwsh
        run: |
          # Make the real PDF text/selection-index test run on a fresh runner.
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\pdfium.ps1 -Destination target\debug\deps
          if ($LASTEXITCODE -ne 0) { throw 'Test PDF runtime staging failed.' }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\dev.ps1 check -Offline
          if ($LASTEXITCODE -ne 0) { throw 'Release checks failed.' }

      - name: Build the installer and portable package
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\installer.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Verify isolated installer lifecycle
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\test-installer.ps1 -Version ${{ steps.version.outputs.version }} -SkipReaderLaunch
          if ($LASTEXITCODE -ne 0) { throw 'Installer lifecycle checks failed.' }

      - name: Zip the portable folder
        shell: pwsh
        run: |
          # Zip the payload built above, never a portable folder restored from cache.
          $version = '${{ steps.version.outputs.version }}'
          $stage = 'target\release-portable\simPl'
          if (Test-Path -LiteralPath $stage) { Remove-Item -LiteralPath $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item -Path 'target\installer-payload\*' -Destination $stage -Recurse
          if (-not (Test-Path -LiteralPath (Join-Path $stage 'LICENSE.txt'))) { throw 'Portable package is missing LICENSE.txt.' }
          Compress-Archive -Path $stage -DestinationPath "target\simPl-$version-windows-x64-portable.zip" -Force

      - name: Publish the draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: simPl ${{ steps.version.outputs.version }}
          draft: true
          generate_release_notes: true
          files: |
            target/installer/*.exe
            target/installer/*.sha256
            target/installer/release.json
            target/simPl-${{ steps.version.outputs.version }}-windows-x64-portable.zip
