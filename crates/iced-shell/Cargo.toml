[package]
name = "iced-shell"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
iced = { version = "=0.14.0", default-features = false, features = ["advanced", "wgpu", "thread-pool", "image-without-codecs"] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
log = { version = "=0.4.34", default-features = false }
reader-workload = { path = "../reader-workload" }
sha2 = { version = "=0.10.9", default-features = false }
unicode-segmentation = "=1.13.3"
shell-startup-markers = { path = "../shell-startup-markers" }
