[package]
name = "iced-shell"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
iced = { version = "=0.14.0", default-features = false, features = ["advanced", "tiny-skia", "thread-pool", "image-without-codecs"] }
iced_futures = { version = "=0.14.0", default-features = false }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
reader-document = { path = "../reader-document" }
reader-pdf = { path = "../reader-pdf" }
reader-workload = { path = "../reader-workload" }
sha2 = { version = "=0.10.9", default-features = false }
unicode-segmentation = "=1.13.3"
shell-startup-markers = { path = "../shell-startup-markers" }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_UI_Controls_Dialogs"] }
parking_lot = "=0.12.5"

serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[dev-dependencies]
# Exercise the production CPU renderer without a native window or desktop helper.
tiny-skia = { version = "=0.11.4", default-features = false, features = ["std", "simd"] }
