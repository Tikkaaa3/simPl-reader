[package]
name = "reader-document"
version.workspace = true
edition.workspace = true
publish.workspace = true
license-file.workspace = true

[dependencies]
reader-core = { path = "../reader-core" }
html5ever = "=0.35.0"
markup5ever_rcdom = "=0.35.0"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
sha2 = { version = "=0.10.9", default-features = false }
percent-encoding = "=2.3.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
roxmltree = "=0.21.1"
pulldown-cmark = { version = "=0.13.4", default-features = false, features = ["html"] }
parking_lot = "=0.12.5"
unicode-normalization = "=0.1.25"
reader-profile = { path = "../reader-profile" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Globalization"] }

# Legacy (non-Unicode) text uses the locale's Windows code page, as on the desktop.
[target.'cfg(not(windows))'.dependencies]
encoding_rs = "=0.8.42"
