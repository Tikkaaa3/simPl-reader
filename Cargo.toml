# One active UI path; measurement tools are opt-in, not product prerequisites.
[workspace]
resolver = "3"
default-members = ["crates/iced-shell"]
members = [
    "crates/reader-core",
    "crates/reader-profile",
    "crates/reader-layout",
    "crates/reader-document",
    "crates/reader-pdf",
    "crates/reader-workload",
    "crates/process-measure",
    "crates/iced-shell",
    "crates/shell-startup-markers",
    "crates/reader-ffi",
    "crates/uniffi-bindgen",
]

# Keep the verified RTL rich-run placement fix until an upstream replacement
# passes the retained visual/copy cases. See crates/iced-shell/README.md.
[patch.crates-io]
cosmic-text = { path = "patches/cosmic-text-0.15.0" }
# Avoid repainting contained damage regions repeatedly in the CPU compositor.
iced_graphics = { path = "patches/iced_graphics-0.14.0" }
# Cached control icons must respect the scroll layer clip at every offset.
iced_tiny_skia = { path = "patches/iced_tiny_skia-0.14.1" }

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false
license-file = "LICENSE.md"

# Preserve the existing release settings; tune only against actual reader runs.
[profile.release]
opt-level = 3
lto = "thin"
panic = "unwind"
strip = "symbols"

# Android app core: release settings, but keep the symbol table. UniFFI reads its
# binding metadata from it, and the Android Gradle build strips the packaged .so.
[profile.android-release]
inherits = "release"
strip = "none"
